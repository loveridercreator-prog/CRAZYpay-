<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E24" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="greenInfinity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CC63F" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Tile Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#8CC63F" stroke-opacity="0.25" stroke-width="4" />

  <!-- Green Infinity Symbol (Currency Loop) -->
  <g filter="url(#glow)">
    <path
      d="M 170 196
         C 120 196, 80 223, 80 256
         C 80 289, 120 316, 170 316
         C 220 316, 256 256, 256 256
         C 256 256, 292 196, 342 196
         C 392 196, 432 223, 432 256
         C 432 289, 392 316, 342 316
         C 292 316, 256 256, 256 256
         C 256 256, 220 196, 170 196 Z"
      fill="none"
      stroke="url(#greenInfinity)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Central Currency Node Accents -->
  <circle cx="170" cy="256" r="16" fill="#8CC63F" />
  <circle cx="342" cy="256" r="16" fill="#10B981" />
  <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.9" />
</svg>
