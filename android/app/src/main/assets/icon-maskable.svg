<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E24" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="greenInfinityMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CC63F" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable compliance -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe Zone Graphic (Scale 0.72 centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)" filter="url(#glowMask)">
    <path
      d="M 170 196
         C 120 196, 80 223, 80 256
         C 80 289, 120 316, 170 316
         C 220 316, 256 256, 256 256
         C 256 256, 292 196, 342 196
         C 392 196, 432 223, 432 256
         C 432 289, 392 316, 342 316
         C 292 316, 256 256, 256 256
         C 256 256, 220 196, 170 196 Z"
      fill="none"
      stroke="url(#greenInfinityMask)"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="170" cy="256" r="18" fill="#8CC63F" />
    <circle cx="342" cy="256" r="18" fill="#10B981" />
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
