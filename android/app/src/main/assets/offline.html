<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CrazyPay Custom P2P Engine - Offline Mode</title>
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    h1 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    button {
      flex: 1;
      background: var(--primary);
      color: #0b0f19;
      font-weight: 700;
      font-size: 14px;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="https://i.ibb.co/3Y4SNK6V/image.png" alt="CrazyPay Logo" />
    </div>
    <span class="badge">Offline Storage Ready</span>
    <h1>CrazyPay Custom P2P Engine</h1>
    <p>You are currently disconnected from the network. Cached ledger state and order data are preserved. Automated UTR reconciliation will resume once network connection is restored.</p>
    <div class="actions">
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </div>
</body>
</html>
